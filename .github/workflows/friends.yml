# Сборка и публикация сайта на GitHub Pages — без коммитов в репозиторий.
#
# Раньше этот процесс коммитил готовую версию для друзей в ветку main, и каждая
# её версия навсегда оставалась в истории публичного репозитория. Теперь сайт
# собирается здесь и публикуется архивом (артефактом) прямо в GitHub Pages:
# в репозитории версии для друзей больше нет, её прошлые состояния не копятся.
#
# Что публикуется: основная версия (index.html — собирается из src/ заново),
# версия для друзей (friends/ — из закрытого репозитория данных) и всё, что им
# нужно (шрифты, границы, обложки, библиотеки, значки). Исходники, тесты и
# служебные файлы в архив не попадают.
#
# Запускается:
#   • после каждого слияния в main;
#   • по расписанию — 4 раза в сутки (обновить данные в версии для друзей и
#     «добрать» записи, у которых прошла задержка публикации);
#   • вручную — Actions → «Сборка сайта» → Run workflow.
#
# Настройки репозитория:
#   • Settings → Pages → Build and deployment → Source: «GitHub Actions»;
#   • Settings → Secrets and variables → Actions:
#       переменная DATA_REPO — например, echernyshevskiy/travel-map-data;
#       секрет DATA_TOKEN — токен с доступом Contents: Read-only к этому репозиторию;
#       переменная FRIENDS_DELAY_DAYS (по желанию) — задержка публикации в днях,
#         по умолчанию 7, 0 — без задержки.
name: Сборка сайта

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Собрать index.html из src/
        run: npm run build
      - name: Собрать версию для друзей
        run: node scripts/build-friends.mjs
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          FRIENDS_DELAY_DAYS: ${{ vars.FRIENDS_DELAY_DAYS }}
      - name: Сложить сайт
        run: node scripts/site-files.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
