# Сборка сайта (вариант A): исходники лежат в src/, а GitHub Pages отдаёт
# готовые index.html и friends/index.html из корня ветки. Этот процесс
# собирает их и коммитит, если что-то изменилось. Запускается:
#   • когда вы загружаете изменения в src/, package.json, vite.config.mjs или scripts/;
#   • по расписанию — 4 раза в сутки (обновить данные в версии для друзей);
#   • вручную — Actions → «Сборка сайта» → Run workflow.
# Нужны настройки репозитория (Settings → Secrets and variables → Actions):
#   • переменная DATA_REPO — например, echernyshevskiy/travel-map-data;
#   • секрет DATA_TOKEN — токен с доступом Contents: Read-only к этому репозиторию.
name: Сборка сайта

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - src/**
      - package.json
      - package-lock.json
      - vite.config.mjs
      - scripts/**

permissions:
  contents: write
  pages: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Собрать index.html из src/
        run: npm run build
      - name: Собрать версию для друзей
        run: node scripts/build-friends.mjs
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      - name: Опубликовать, если что-то изменилось
        id: publish
        run: |
          if git diff --quiet -- index.html friends/index.html; then
            echo "Ничего не изменилось — публиковать нечего"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html friends/index.html
          git commit -m "Сборка сайта: index.html и версия для друзей"
          git pull --rebase
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Обновить сайт GitHub Pages
        if: steps.publish.outputs.changed == '1'
        # на случай, если коммит от имени бота не запустит публикацию сам
        run: gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || echo "Публикация запустится сама"
        env:
          GH_TOKEN: ${{ github.token }}
