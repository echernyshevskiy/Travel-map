# Автотесты: при каждой загрузке файлов в репозиторий открывают обе версии
# карты в настоящем Chromium (телефон и ПК) и проверяют основные сценарии.
# Результат — зелёная галочка или красный крестик у коммита; при ошибке
# подробный отчёт со снимками лежит в разделе Actions → запуск → Artifacts.
name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
