# Автотесты: при каждой загрузке файлов в репозиторий сначала проверяют код
# (ESLint: необъявленные имена, лишний код) и чистую логику (src/lib — модульные тесты Vitest, пара секунд), затем собирают карту
# из src/ и открывают обе версии в настоящем Chromium (телефон и ПК).
# Результат — зелёная галочка или красный крестик у коммита; при ошибке
# подробный отчёт со снимками лежит в разделе Actions → запуск → Artifacts.
name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

# тестам достаточно читать код: даже если зависимость окажется вредоносной,
# у неё не будет права что-либо записать в репозиторий
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # Playwright 1.56 не ставит браузер на ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # для поиска секретов нужна вся история
      # Поиск ключей, токенов и паролей во всей истории (правила — .gitleaks.toml).
      # Версия и контрольная сумма закреплены: скачанный файл проверяется перед запуском.
      - name: Поиск секретов (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка кода (ESLint)
        run: npm run lint
      - name: Оформление кода (Prettier)
        run: npm run format:check
      - name: Модульные тесты (src/lib)
        run: npm run test:unit
      - name: Собрать index.html из src/
        run: npm run build
      # Сайт публикуется из свежей сборки, а релизы и сравнение версий берут
      # index.html из репозитория: они должны совпадать (забыли пересобрать — PR красный)
      - name: index.html в репозитории совпадает со сборкой
        run: git diff --exit-code --stat -- index.html || { echo "index.html устарел — выполните npm run build и закоммитьте его"; exit 1; }
      # сборка сама кладёт шрифты и библиотеку карты в fonts/ и vendor/ — новые файлы должны быть в репозитории
      - name: fonts/ и vendor/ в репозитории совпадают со сборкой
        run: |
          left=$(git status --porcelain -- fonts vendor)
          if [ -n "$left" ]; then echo "$left"; echo "Сборка изменила fonts/ или vendor/ — закоммитьте эти файлы"; exit 1; fi
      - name: Собрать версию для друзей на тестовых данных
        run: node scripts/build-friends.mjs --data tests/fixtures/friends-sample.json
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
