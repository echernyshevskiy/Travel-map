# Настройки gitleaks — поиска ключей, токенов и паролей в коммитах.
# Запускается перед каждым коммитом (.githooks/pre-commit) и в CI
# (.github/workflows/tests.yml, шаг «Поиск секретов»). Правила — стандартные
# правила gitleaks; ниже — только известные ложные срабатывания.
title = "Travel-map"

[extend]
useDefault = true

[[allowlists]]
# В собранном (минифицированном) index.html фрагмент вида
# «!s.countryKey||s.countryKey===i» (проверка «страна та же»)
# похож на «ключ» только из-за имени переменной countryKey — это код, не секрет.
# Исключение — по самому найденному фрагменту (а не по строке файла: в сборке
# весь код — одна строка, и исключение по ней пропускало бы настоящие ключи).
# targetRules здесь не указан: в gitleaks 8.28 он не действует на стандартные
# правила, подключённые через [extend].
description = "минифицированный код: имя переменной countryKey"
regexTarget = "match"
regexes = ['''^[\w.$]*countryKey\|\|[\w.$]*countryKey===[\w$]+;?$''']
