# Еженедельная резервная копия данных «Карты путешествий».
# Этот файл кладётся В РЕПОЗИТОРИЙ ДАННЫХ (закрытый), по пути
#   .github/workflows/backup.yml
# Раз в неделю (и по кнопке Actions → «Резервная копия данных» → Run workflow):
#   • проверяет, что travel-data.json цел (читается, есть записи) — если файл
#     повреждён, запуск падает, и GitHub присылает письмо;
#   • если данные изменились с прошлой копии — создаёт выпуск (Releases)
#     «backup-ГГГГ-ММ-ДД» с двумя файлами: сам travel-data.json и вся история
#     репозитория одним файлом (git bundle) — из него репозиторий
#     восстанавливается целиком командой git clone history-….bundle;
#   • хранит последние 12 копий, более старые удаляет.
# Выпуски закрытого репозитория видны только вам.
name: Резервная копия данных

on:
  schedule:
    - cron: '17 3 * * 0'   # воскресенье, 06:17 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить файл данных
        run: |
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("travel-data.json", "utf8"));
            if(!Array.isArray(d.entries)) throw new Error("в файле нет списка записей");
            if(d.entries.length === 0) throw new Error("список записей пуст — копию не делаю");
            const bad = d.entries.filter(e => !e || typeof e !== "object" || !e.id || !e.type).length;
            const sum = `Записей: ${d.entries.length}, стартов: ${(d.races || []).length}, сохранено: ${d.savedAt || "?"}` + (bad ? `, повреждённых записей: ${bad}` : "");
            fs.writeFileSync("summary.txt", sum + "\n");
            console.log(sum);
          '

      - name: Сделать копию, если данные изменились
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          last=$(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep '^backup-' | sort -r | head -n 1 || true)
          if [ -n "$last" ] && [ "$(git rev-list -n 1 "refs/tags/$last" 2>/dev/null || true)" = "$head" ]; then
            echo "Данные не менялись с копии $last — новая не нужна"
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          tag="backup-$day"
          if gh release view "$tag" >/dev/null 2>&1; then tag="$tag-$(date -u +%H%M)"; fi
          mkdir -p out
          cp travel-data.json "out/travel-data-$day.json"
          git bundle create "out/history-$day.bundle" --all
          gh release create "$tag" out/* --target "$head" --title "Копия данных $day" --notes-file summary.txt
          echo "Создана копия $tag"

      - name: Оставить последние копии
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^backup-' | sort -r | tail -n +$((KEEP + 1)) |
            while read -r t; do gh release delete "$t" --yes --cleanup-tag; echo "Удалена старая копия $t"; done
